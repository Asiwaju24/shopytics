# One command to run everything:   docker compose up --build
# Then open http://localhost:8080  (create an account; the first screen sets up your shop)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ipace
      POSTGRES_USER: ipace
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-this-password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ipace -d ipace"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in a .env file next to docker-compose.yml}
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8080}
      DATABASE_URL: postgres://ipace:${DB_PASSWORD:-change-this-password}@db:5432/ipace
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  pgdata:
